plugins {
    id 'fabric-loom' version '1.10.5'
    id 'java'
}

group = 'dev.cudzer'
version = '1.4.0+server.4'
base { archivesName = 'CobblemonSizeVariation-fabric-1.21.1' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = 'https://maven.impactdev.net/repository/development'
        content { includeGroup 'com.cobblemon' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.14+1.21.1'
    modImplementation 'net.fabricmc:fabric-language-kotlin:1.13.13+kotlin.2.4.10'
    modImplementation 'com.cobblemon:fabric:1.7.3+1.21.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'fabric/src/main/resources']
    }
}

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
test { useJUnitPlatform() }

// Test-only entrypoint, never included in a normal release build.
if (providers.gradleProperty('serverSmoke').isPresent()) {
    sourceSets.main.java.srcDir 'src/smoke/java'
    processResources {
        inputs.property 'serverSmoke', true
        doLast {
            def metadata = file("$destinationDir/fabric.mod.json")
            def json = new groovy.json.JsonSlurper().parse(metadata)
            json.entrypoints.main.add('dev.cudzer.cobblemonsizevariation.smoke.ServerSmokeTests')
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
}
